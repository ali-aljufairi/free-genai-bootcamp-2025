services:
  postgres:
    build:
      context: .
      dockerfile: config/Dockerfile.postgres
    container_name: sorami-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sorami}
      POSTGRES_USER: ${POSTGRES_USER:-sorami_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/usr/lib/postgresql/17/main/postgresql.conf
      - ./config/pg_hba.conf:/usr/lib/postgresql/17/main/pg_hba.conf

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sorami_user} -d ${POSTGRES_DB:-sorami}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
    name: sorami-network
