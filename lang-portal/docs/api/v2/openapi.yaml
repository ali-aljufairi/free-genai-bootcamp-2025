openapi: 3.1.0
info:
  title: Sorami Language Portal API v2
  description: |
    Complete API for the Sorami Language Learning Platform.
    
    This API provides endpoints for:
    - User Management (profiles, settings, roles, subscriptions)
    - Content Management (kanji, vocabulary, grammar)
    - Study Activities (flashcards, writing, speech)
    - JLPT Exam Preparation
    - Progress Tracking and Analytics
    - Course and Curriculum Management
    
    ## Authentication
    Currently, authentication is disabled for development. All endpoints are publicly accessible.
    
    ## Base URL
    All endpoints are prefixed with `/api/v2`
    
    ## Response Format
    All responses are in JSON format with the following structure:
    - Success responses: Direct data or `{"message": "success message"}`
    - Error responses: `{"error": "error message"}`
    
    ## Rate Limiting
    Rate limiting is not currently implemented.
    
    ## Versioning
    This is API version 2.0. Previous versions are available at `/api/v1`
  version: 2.0.0
  contact:
    name: Sorami Language Portal
    email: support@sorami.com
    url: https://sorami.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v2
    description: Development server
  - url: https://api.sorami.com/api/v2
    description: Production server

tags:
  - name: User Management
    description: User profiles, settings, roles, and subscriptions
  - name: Content Management
    description: Kanji, vocabulary, grammar, and content relationships
  - name: Study Activities
    description: Flashcards, writing practice, speech analysis
  - name: JLPT Exam
    description: JLPT practice tests and exam preparation
  - name: Progress Tracking
    description: Learning progress, analytics, and SRS
  - name: Course Management
    description: Courses, units, lessons, and curriculum
  - name: Dashboard
    description: User dashboard and statistics

paths:
  # Health check endpoint
  /health:
    get:
      summary: Health check
      description: Check if the API is running
      tags:
        - System
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-01T00:00:00Z"

  # Include user management endpoints
  /users/{id}/profile:
    $ref: './user-management.yaml#/paths/~1users~1{id}~1profile'
  
  /users:
    $ref: './user-management.yaml#/paths/~1users'
  
  /users/{id}:
    $ref: './user-management.yaml#/paths/~1users~1{id}'
  
  /users/{id}/settings:
    $ref: './user-management.yaml#/paths/~1users~1{id}~1settings'
  
  /users/{id}/roles:
    $ref: './user-management.yaml#/paths/~1users~1{id}~1roles'
  
  /users/{id}/subscription:
    $ref: './user-management.yaml#/paths/~1users~1{id}~1subscription'

components:
  schemas:
    # Common schemas
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error

    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          description: Success message
      required:
        - message

    # Include user management schemas
    User:
      $ref: './user-management.yaml#/components/schemas/User'
    
    UserSettings:
      $ref: './user-management.yaml#/components/schemas/UserSettings'
    
    UserRole:
      $ref: './user-management.yaml#/components/schemas/UserRole'
    
    Subscription:
      $ref: './user-management.yaml#/components/schemas/Subscription'
    
    UserProfile:
      $ref: './user-management.yaml#/components/schemas/UserProfile'
    
    CreateUserRequest:
      $ref: './user-management.yaml#/components/schemas/CreateUserRequest'
    
    UpdateUserRequest:
      $ref: './user-management.yaml#/components/schemas/UpdateUserRequest'
    
    UpdateUserSettingsRequest:
      $ref: './user-management.yaml#/components/schemas/UpdateUserSettingsRequest'
    
    AssignRoleRequest:
      $ref: './user-management.yaml#/components/schemas/AssignRoleRequest'
    
    CreateSubscriptionRequest:
      $ref: './user-management.yaml#/components/schemas/CreateSubscriptionRequest'
    
    UpdateSubscriptionRequest:
      $ref: './user-management.yaml#/components/schemas/UpdateSubscriptionRequest'

  responses:
    BadRequest:
      description: Bad request - Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: User ID
      example: 1

    JLPTLevel:
      name: level
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 5
      description: JLPT level (1-5)
      example: 3

    GroupID:
      name: group_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Group ID
      example: 1

    StudySessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Study session ID
      example: 1

  securitySchemes:
    # Placeholder for future authentication
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication (currently disabled) 