[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core API
    "fastapi>=0.115.12",
    "uvicorn>=0.34.0",
    
    # AI/LLM
    "langchain-community>=0.3.18",
    "langchain-groq>=0.2.4",
    "langgraph>=0.3.1",
    "tavily-python>=0.5.1",
    
    # Google APIs
    "google-api-python-client>=2.162.0",
    
    # Data
    "pydantic>=2.10.6",
    "psycopg2-binary>=2.9.9",
    "requests>=2.32.3",
    
    # Utilities
    "beautifulsoup4>=4.13.3",
    "jinja2>=3.1.4",
    "python-jose[cryptography]>=3.3.0",
]

# Optional dependencies for Streamlit UI and development
[project.optional-dependencies]
dev = [
    "streamlit>=1.42.2",
    "pandas>=2.2.3",
    "plotly>=6.0.0",
    "ipython>=9.0.0",
    "watchdog>=6.0.0",
]
