name: Build, Push and Deploy Lang Portal

on:
  push:
    branches: [main]
    paths:
      - "lang-portal/**"
      - "k8s/service.yaml"
  pull_request:
    branches: [main]
    paths:
      - "lang-portal/**"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Skip build and deploy existing images"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_only != 'true' }}
    permissions:
      contents: read
      packages: write

    outputs:
      api_image: ${{ steps.meta-api.outputs.tags }}
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/lang-portal-api
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/lang-portal-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare environment files
        run: |
          cd lang-portal
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f frontend/.env.example ]; then
            cp frontend/.env.example frontend/.env
          fi

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./lang-portal
          file: ./lang-portal/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./lang-portal/frontend
          file: ./lang-portal/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || github.event.inputs.deploy_only == 'true') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify Tailscale connection
        run: |
          echo "Tailscale status:"
          tailscale status
          echo ""
          echo "Tailscale IP:"
          tailscale ip -4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Configure kubectl for K3s via Tailscale
        run: |
          mkdir -p ~/.kube
          # Decode base64-encoded kubeconfig and write to file
          # GitHub Actions automatically redacts secrets from logs
          if ! echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config; then
            echo "ERROR: Failed to decode KUBECONFIG secret"
            exit 1
          fi
          chmod 600 ~/.kube/config
          # Verify config file was created and is not empty
          if [ ! -s ~/.kube/config ]; then
            echo "ERROR: KUBECONFIG file is empty or missing"
            exit 1
          fi
          echo "KUBECONFIG configured successfully"

      - name: Verify Kubernetes connection
        run: |
          echo "Testing kubectl connection..."
          kubectl cluster-info
          kubectl get nodes

      - name: Update Kubernetes deployments
        run: |
          # Always use latest tag on main branch (pushed by docker/build-push-action)
          API_IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/lang-portal-api:latest"
          FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/lang-portal-frontend:latest"

          echo "Deploying API image: $API_IMAGE"
          echo "Deploying Frontend image: $FRONTEND_IMAGE"

          # Update deployments with new images
          kubectl set image deployment/lang-portal-api \
            lang-portal-api=$API_IMAGE \
            -n sorami

          kubectl set image deployment/lang-portal-frontend \
            lang-portal-frontend=$FRONTEND_IMAGE \
            -n sorami

          # Force rollout restart to ensure all pods are replaced
          # This is necessary because using 'latest' tag doesn't trigger pod replacement
          # when the tag hasn't changed, even with imagePullPolicy: Always
          echo "Forcing rollout restart for API deployment..."
          kubectl rollout restart deployment/lang-portal-api -n sorami

          echo "Forcing rollout restart for Frontend deployment..."
          kubectl rollout restart deployment/lang-portal-frontend -n sorami

      - name: Wait for rollout
        run: |
          echo "Waiting for API deployment rollout..."
          kubectl rollout status deployment/lang-portal-api -n sorami --timeout=300s

          echo "Waiting for Frontend deployment rollout..."
          kubectl rollout status deployment/lang-portal-frontend -n sorami --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n sorami
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n sorami -o wide
          echo ""
          echo "=== Pod Images Verification ==="
          echo "API Pods:"
          kubectl get pods -n sorami -l app=lang-portal-api -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[0].image}{"\t"}{.status.phase}{"\n"}{end}'
          echo ""
          echo "Frontend Pods:"
          kubectl get pods -n sorami -l app=lang-portal-frontend -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[0].image}{"\t"}{.status.phase}{"\n"}{end}'
          echo ""
          echo "=== Verifying All Pods Are Running ==="
          API_PODS=$(kubectl get pods -n sorami -l app=lang-portal-api --field-selector=status.phase=Running --no-headers | wc -l)
          FRONTEND_PODS=$(kubectl get pods -n sorami -l app=lang-portal-frontend --field-selector=status.phase=Running --no-headers | wc -l)
          API_REPLICAS=$(kubectl get deployment lang-portal-api -n sorami -o jsonpath='{.spec.replicas}')
          FRONTEND_REPLICAS=$(kubectl get deployment lang-portal-frontend -n sorami -o jsonpath='{.spec.replicas}')
          echo "API: $API_PODS/$API_REPLICAS pods running"
          echo "Frontend: $FRONTEND_PODS/$FRONTEND_REPLICAS pods running"
          if [ "$API_PODS" -lt "$API_REPLICAS" ] || [ "$FRONTEND_PODS" -lt "$FRONTEND_REPLICAS" ]; then
            echo "ERROR: Not all pods are running!"
            exit 1
          fi
          echo "All pods are running successfully"
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n sorami --sort-by='.lastTimestamp' | tail -20

      - name: Post deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully deployed to Kubernetes cluster via Tailscale" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: \`${{ env.REGISTRY }}/${{ env.OWNER }}/lang-portal-api:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: \`${{ env.REGISTRY }}/${{ env.OWNER }}/lang-portal-frontend:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployments" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -n sorami -o wide >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
