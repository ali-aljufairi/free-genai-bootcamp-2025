name: Deploy Lang Portal API

on:
    push:
        branches: [main]
        paths:
            - "lang-portal/cmd/**"
            - "lang-portal/internal/**"
            - "lang-portal/go.mod"
            - "lang-portal/go.sum"
            - "lang-portal/Dockerfile"
            - "k8s/service.yaml"
    workflow_dispatch:
        inputs:
            deploy_only:
                description: "Skip build and deploy existing images"
                required: false
                default: false
                type: boolean

env:
    REGISTRY: ghcr.io
    OWNER: ${{ github.repository_owner }}
    IMAGE_TAG: latest

jobs:
    build-and-push-api:
        runs-on: ubuntu-latest
        if: ${{ github.event.inputs.deploy_only != 'true' }}
        permissions:
            contents: read
            packages: write

        outputs:
            api_image: ${{ steps.meta-api.outputs.tags }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract metadata for API
              id: meta-api
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.OWNER }}/lang-portal-api
                  tags: |
                      type=sha,prefix=
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Prepare environment files
              run: |
                  cd lang-portal
                  if [ -f .env.example ]; then
                    cp .env.example .env
                  fi

            - name: Build and push API image
              uses: docker/build-push-action@v5
              with:
                  context: ./lang-portal
                  file: ./lang-portal/Dockerfile
                  push: true
                  tags: ${{ steps.meta-api.outputs.tags }}
                  labels: ${{ steps.meta-api.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-api:
        runs-on: ubuntu-latest
        needs: [build-and-push-api]
        if: always() && (needs.build-and-push-api.result == 'success' || github.event.inputs.deploy_only == 'true') && github.ref == 'refs/heads/main'
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Connect to Tailscale
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            - name: Verify Tailscale connection
              run: |
                  echo "Tailscale status:"
                  tailscale status
                  echo ""
                  echo "Tailscale IP:"
                  tailscale ip -4

            - name: Set up kubectl
              uses: azure/setup-kubectl@v4
              with:
                  version: "latest"

            - name: Configure kubectl for K3s via Tailscale
              run: |
                  mkdir -p ~/.kube
                  # Decode base64-encoded kubeconfig and write to file
                  # GitHub Actions automatically redacts secrets from logs
                  if ! echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config; then
                    echo "ERROR: Failed to decode KUBECONFIG secret"
                    exit 1
                  fi
                  chmod 600 ~/.kube/config
                  # Verify config file was created and is not empty
                  if [ ! -s ~/.kube/config ]; then
                    echo "ERROR: KUBECONFIG file is empty or missing"
                    exit 1
                  fi
                  echo "KUBECONFIG configured successfully"

            - name: Verify Kubernetes connection
              run: |
                  echo "Testing kubectl connection..."
                  kubectl cluster-info
                  kubectl get nodes

            - name: Update API deployment
              run: |
                  # Always use latest tag on main branch (pushed by docker/build-push-action)
                  API_IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/lang-portal-api:latest"

                  echo "Deploying API image: $API_IMAGE"

                  # Update deployment with new image
                  kubectl set image deployment/lang-portal-api \
                    lang-portal-api=$API_IMAGE \
                    -n sorami

                  # Force rollout restart to ensure pod is replaced
                  echo "Forcing rollout restart for API deployment..."
                  kubectl rollout restart deployment/lang-portal-api -n sorami

            - name: Wait for API rollout
              run: |
                  echo "Waiting for API deployment rollout..."
                  kubectl rollout status deployment/lang-portal-api -n sorami --timeout=300s

            - name: Verify API deployment
              run: |
                  echo "=== API Deployment Status ==="
                  kubectl get deployment lang-portal-api -n sorami
                  echo ""
                  echo "=== API Pod Status ==="
                  kubectl get pods -n sorami -l app=lang-portal-api -o wide
                  echo ""
                  echo "=== API Pod Image Verification ==="
                  kubectl get pods -n sorami -l app=lang-portal-api -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[0].image}{"\t"}{.status.phase}{"\n"}{end}'
                  echo ""
                  echo "=== Verifying API Pods Are Running ==="
                  API_PODS=$(kubectl get pods -n sorami -l app=lang-portal-api --field-selector=status.phase=Running --no-headers | wc -l)
                  API_REPLICAS=$(kubectl get deployment lang-portal-api -n sorami -o jsonpath='{.spec.replicas}')
                  echo "API: $API_PODS/$API_REPLICAS pods running"
                  if [ "$API_PODS" -lt "$API_REPLICAS" ]; then
                    echo "ERROR: Not all API pods are running!"
                    exit 1
                  fi
                  echo "API deployment successful"
                  echo ""
                  echo "=== Recent Events ==="
                  kubectl get events -n sorami --sort-by='.lastTimestamp' | tail -10

            - name: Post API deployment summary
              run: |
                  echo "## API Deployment Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Successfully deployed API to Kubernetes cluster via Tailscale" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Image Deployed" >> $GITHUB_STEP_SUMMARY
                  echo "- **API**: \`${{ env.REGISTRY }}/${{ env.OWNER }}/lang-portal-api:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Deployment" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  kubectl get deployment lang-portal-api -n sorami -o wide >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
