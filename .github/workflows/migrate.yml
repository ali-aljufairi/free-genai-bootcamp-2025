name: Database Migration

on:
  push:
    branches: [main]
    paths:
      - "lang-portal/internal/database/migrations/**"

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify Tailscale connection
        run: |
          tailscale status
          # Verify we can reach Kubernetes DNS
          nslookup kubernetes.default.svc.cluster.local || true

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Configure kubectl for K3s via Tailscale
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify Kubernetes connection
        run: kubectl cluster-info

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.x"

      - name: Prepare environment files
        run: |
          cd lang-portal
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Setup database port-forward tunnel
        run: |
          # Start kubectl port-forward in background to tunnel to database
          kubectl port-forward -n sorami service/sorami-postgres-rw 5432:5432 &
          PF_PID=$!
          echo "PF_PID=$PF_PID" >> $GITHUB_ENV
          
          # Wait for port-forward to be ready
          sleep 3
          
          # Test the tunnel
          echo "Testing port-forward tunnel..."
          nc -zv localhost 5432 || true
          
          # Use localhost as the endpoint
          echo "DB_ENDPOINT=localhost" >> $GITHUB_ENV

      - name: Check migration status
        run: |
          cd lang-portal
          make db-migrate-status
        env:
          DB_HOST: ${{ env.DB_ENDPOINT }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Run database migrations
        run: |
          cd lang-portal
          make db-migrate
        timeout-minutes: 10
        env:
          DB_HOST: ${{ env.DB_ENDPOINT }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Verify migration success
        run: |
          cd lang-portal
          make db-migrate-status
        env:
          DB_HOST: ${{ env.DB_ENDPOINT }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Post migration summary
        run: |
          echo "## Database Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Migrations completed successfully on Kubernetes cluster" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Migration Status" >> $GITHUB_STEP_SUMMARY
          echo "- Status verified" >> $GITHUB_STEP_SUMMARY
