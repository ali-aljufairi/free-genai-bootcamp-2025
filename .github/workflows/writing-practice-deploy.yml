name: Build, Push and Deploy Writing Practice Service

on:
  push:
    branches: [main]
    paths:
      - "writing-practice/**"
  pull_request:
    branches: [main]
    paths:
      - "writing-practice/**"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Skip build and deploy existing images"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy_only != 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/writing-practice-api
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push writing-practice image
        uses: docker/build-push-action@v5
        with:
          context: ./writing-practice
          file: ./writing-practice/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || github.event.inputs.deploy_only == 'true') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Verify Tailscale connection
        run: |
          echo "Tailscale status:"
          tailscale status
          echo ""
          echo "Tailscale IP:"
          tailscale ip -4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Configure kubectl for K3s via Tailscale
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify Kubernetes connection
        run: |
          echo "Testing kubectl connection..."
          kubectl cluster-info
          kubectl get nodes

      - name: Update Kubernetes deployment
        run: |
          # Set image tag
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/writing-practice-api:${{ env.IMAGE_TAG }}"

          echo "Deploying image: $IMAGE"

          # Update deployment with new image
          kubectl set image deployment/writing-practice \
            writing-practice=$IMAGE \
            -n sorami

      - name: Wait for rollout
        run: |
          echo "Waiting for writing-practice deployment rollout..."
          kubectl rollout status deployment/writing-practice -n sorami --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment writing-practice -n sorami
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n sorami -l app=writing-practice
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n sorami --field-selector involvedObject.name=writing-practice --sort-by='.lastTimestamp' | tail -10

      - name: Post deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed writing-practice to Kubernetes cluster via Tailscale" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Writing Practice**: \`${{ env.REGISTRY }}/${{ env.OWNER }}/writing-practice-api:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
