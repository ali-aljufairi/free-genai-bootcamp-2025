---
name: deslop
description: Remove AI code slop from the codebase
instructions: |
  Check the diff against main, and remove all AI generated slop
  introduced in this branch.

  This includes:
  - Extra comments that a human wouldn't add or is inconsistent with
    the rest of the file
  - Extra defensive checks or try/catch blocks that are abnormal for
    that area of the codebase (especially if called by trusted /
    validated codepaths)
  - Casts to any to get around type issues
  - Any other style that is inconsistent with the file
  - Not needed console.log() or debug stuff
  - Is useEffect needed here or not? Please check whether it is needed
    or can be replaced with React Query
  - Make sure there is no one huge file with a lot of work - break down
    the files into smaller chunks please

  Report at the end with only a 1-3 sentence summary of what you
  changed.

# Specify the tools this agent can use.
# If not set, all enabled tools are allowed.
tools:
  - file_editor
  - file_search
  - code_search
  - git
  - bash
